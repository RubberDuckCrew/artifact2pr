    - cron: "0 3 * * 0"
  push:
    branches: [main]
    paths: [.github/workflows/sync-labels.yml]
  workflow_dispatch:

jobs:
  run:
    uses: RubberDuckCrew/.github/.github/workflows/action-sync-labels.yml@32641492f6cfbc78734b6adea229ec431fd51c9e # v3.1.0
    permissions:
      issues: write
